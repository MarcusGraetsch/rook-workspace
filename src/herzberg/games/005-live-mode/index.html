<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Herzberg Live · Marcus</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #0a0a0f;
    --bg-2: #14141e;
    --panel: #1c1c28;
    --border: #2a2a3a;
    --ink: #e8e8f0;
    --ink-soft: #8a8aa0;
    --accent: #00d97e;
    --accent-2: #ff8e3c;
    --warn: #ff3d6e;
    --upcoming: #3b82f6;
    --past: #4a4a5a;
    --now: #00d97e;
    --pulse: 0 0 20px rgba(0, 217, 126, 0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
  }
  body { padding: 18px; max-width: 900px; margin: 0 auto; }
  /* --- Header --- */
  header {
    text-align: center;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  h1 small {
    color: var(--ink-soft);
    font-weight: 400;
    font-size: 12px;
    margin-left: 8px;
    letter-spacing: 1px;
  }
  /* --- Big time --- */
  .big-time {
    text-align: center;
    margin-bottom: 24px;
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  .big-clock {
    font-size: 48px;
    font-weight: 800;
    font-family: 'Courier New', monospace;
    letter-spacing: 2px;
    color: var(--accent);
    text-shadow: var(--pulse);
  }
  .big-day {
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .live-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0, 217, 126, 0.15);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
    margin-top: 10px;
  }
  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.4); }
  }
  /* --- Now playing hero --- */
  .now-hero {
    background: linear-gradient(135deg, rgba(0,217,126,0.1) 0%, rgba(0,217,126,0.02) 100%);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 18px;
    box-shadow: var(--pulse);
  }
  .now-tag {
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .now-name {
    font-size: 32px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 6px;
  }
  .now-meta {
    color: var(--ink-soft);
    font-size: 13px;
    margin-bottom: 14px;
  }
  .now-meta .stage { color: var(--accent-2); }
  .now-bridge {
    background: rgba(0, 217, 126, 0.1);
    border-left: 3px solid var(--accent);
    padding: 10px 12px;
    border-radius: 0 6px 6px 0;
    font-size: 13px;
    line-height: 1.4;
  }
  .now-bridge strong { color: var(--accent); }
  .now-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .now-actions button {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 8px 12px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
  }
  .now-actions button:hover { background: var(--bg-2); }
  .now-actions button.primary { background: var(--accent); border-color: var(--accent); color: #000; }
  /* --- Up next --- */
  .up-next {
    margin-bottom: 24px;
  }
  .up-next h2 {
    font-size: 13px;
    color: var(--upcoming);
    margin-bottom: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .next-list { display: flex; flex-direction: column; gap: 8px; }
  .next-row {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 60px 1fr auto;
    gap: 12px;
    align-items: center;
    transition: all 0.1s;
  }
  .next-row.urgent { border-color: var(--accent-2); }
  .next-row.urgent .nx-time { color: var(--accent-2); }
  .next-row.gone { opacity: 0.4; }
  .nx-time {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 14px;
    color: var(--upcoming);
    text-align: center;
  }
  .nx-time small { display: block; font-size: 9px; color: var(--ink-soft); margin-top: 2px; }
  .nx-name { font-size: 14px; font-weight: 600; }
  .nx-meta { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .nx-distance {
    font-size: 11px;
    color: var(--ink-soft);
    background: var(--bg-2);
    padding: 4px 8px;
    border-radius: 6px;
  }
  .nx-distance.walking { color: var(--accent-2); }
  /* --- Set reminder --- */
  .reminder-bar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .reminder-bar .lbl { font-size: 12px; color: var(--ink-soft); }
  .reminder-bar select {
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 4px 8px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 12px;
  }
  /* --- Time control --- */
  .time-control {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 18px;
  }
  .time-control h3 {
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .time-control .tc-buttons {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .time-control button {
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }
  .time-control button:hover { background: var(--border); }
  .time-control button.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .time-control .tc-info { font-size: 11px; color: var(--ink-soft); margin-top: 8px; }
  /* --- Footer --- */
  footer {
    text-align: center;
    color: var(--ink-soft);
    font-size: 11px;
    padding: 16px 0 0;
    border-top: 1px solid var(--border);
    margin-top: 24px;
  }
  /* --- Toast --- */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #000;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 12px;
    letter-spacing: 1px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 2000;
    font-weight: 700;
  }
  .toast.show { opacity: 1; }
  /* --- Stage badges --- */
  .stage-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .stage-mainstage { background: rgba(255,142,60,0.2); color: var(--accent-2); }
  .stage-freakstage { background: rgba(0,180,216,0.2); color: #00b4d8; }
  .stage-mentalstage { background: rgba(199,125,255,0.2); color: #c77dff; }
  .stage-hoellenschuppen { background: rgba(255,61,110,0.2); color: var(--warn); }
  .stage-lesenzeit { background: rgba(255,209,102,0.2); color: #ffd166; }
  .stage-unknown { background: rgba(138,138,160,0.2); color: var(--ink-soft); }
  /* --- Sound check / No-data state --- */
  .not-yet {
    text-align: center;
    padding: 32px 16px;
    color: var(--ink-soft);
    background: var(--panel);
    border: 1px dashed var(--border);
    border-radius: 16px;
  }
  .not-yet h3 {
    color: var(--ink);
    font-size: 18px;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>Herzberg Live <small>· on the ground ·</small></h1>
</header>

<div class="big-time">
  <div class="big-clock" id="bigClock">--:--</div>
  <div class="big-day" id="bigDay">Wird geladen…</div>
  <div class="live-indicator"><span class="live-dot"></span>LIVE TICKER</div>
</div>

<div class="time-control">
  <h3>⏰ Zeit-Modus (für Vorschau)</h3>
  <div class="tc-buttons" id="timeButtons">
    <button data-mode="auto" class="active">Echt (System-Uhr)</button>
    <button data-mode="preset" data-day="Mittwoch" data-time="20:00">Mi 20:00 (Warm-up)</button>
    <button data-mode="preset" data-day="Donnerstag" data-time="22:00">Do 22:00</button>
    <button data-mode="preset" data-day="Freitag" data-time="22:00">Fr 22:00</button>
    <button data-mode="preset" data-day="Samstag" data-time="23:00">Sa 23:00 (Peak)</button>
    <button data-mode="preset" data-day="Sonntag" data-time="18:00">So 18:00</button>
  </div>
  <div class="tc-info" id="tcInfo">Läuft auf Systemzeit · Vor-Ort einfach öffnen</div>
</div>

<div class="reminder-bar">
  <span class="lbl">⏰ Set-Erinnerung <span id="reminderTarget"></span></span>
  <select id="reminderLead">
    <option value="5">5 min vorher</option>
    <option value="10" selected>10 min vorher</option>
    <option value="15">15 min vorher</option>
    <option value="30">30 min vorher</option>
  </select>
</div>

<div id="nowArea"></div>

<div class="up-next" id="upNext" style="display:none">
  <h2>⏭ Als nächstes auf deinem Plan</h2>
  <div class="next-list" id="nextList"></div>
</div>

<footer>
  Built with Spotify + sweat · Live-Ticker simuliert Festival-Zeit · GPS-Distanzen sind Schätzungen
</footer>

<div class="toast" id="toast"></div>

<script>
const DATA_URL = 'inline';
let ALL_ACTS = [];
let MY_PICKS = [];  // von sketch 001/002/003 importierte picks
let CURRENT_TIME = null;  // Date-Object, oder null = auto
let REMINDER_ACT = null;  // wenn erinnert werden soll
let REMINDER_LEAD = 10;
let REMINDER_FIRED = false;

// Stage-Distanzen (geschätzt)
const STAGE_DIST = {
  mainstage: 0,
  freakstage: 250,
  mentalstage: 180,
  lesenzeit: 120,
  hoellenschuppen: 350,
  unknown: 200,
};

function load() {
  // Versuche picks aus 002 oder 003 zu importieren
  try {
    const swipe = JSON.parse(localStorage.getItem('herzberg_swipe_v1') || '{}');
    if (swipe.picks) MY_PICKS = swipe.picks.yes || [];
  } catch {}
  if (MY_PICKS.length === 0) {
    try {
      const stamps = JSON.parse(localStorage.getItem('herzberg_stamps_v1') || '[]');
      MY_PICKS = stamps.map(n => ({ name: n }));
    } catch {}
  }
  if (MY_PICKS.length === 0) {
    try {
      const picks = JSON.parse(localStorage.getItem('herzberg_picks_v1') || '[]');
      MY_PICKS = picks.map(n => ({ name: n }));
    } catch {}
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function getCurrentMoment() {
  if (CURRENT_TIME) return CURRENT_TIME;
  // Auto: nutze Systemzeit, ABER "simuliert" auf Festival-Tag gemappt
  // Pragmatisch: nimm den aktuellen Wochentag und passe das Festival-Datum an
  const now = new Date();
  // Finde den passendsten Festival-Tag (heute ist 2026-07-25, also vor Festival)
  // Da das Festival in der Zukunft liegt, simulieren wir mit Do-So 30.07-02.08
  // Wir nehmen den nächsten Festival-Tag relativ zu "jetzt"
  const festivalDays = {
    0: { name: 'Sonntag', date: '02.08.2026' },  // So
    1: { name: 'Mittwoch', date: '29.07.2026' },  // Mi (Vorabend)
    2: { name: 'Donnerstag', date: '30.07.2026' },  // Do
    3: { name: 'Donnerstag', date: '30.07.2026' },
    4: { name: 'Donnerstag', date: '30.07.2026' },
    5: { name: 'Freitag', date: '31.07.2026' },
    6: { name: 'Samstag', date: '01.08.2026' },
  };
  const dayInfo = festivalDays[now.getDay()];
  // Wenn CURRENT_TIME gesetzt ist, nutze das
  return CURRENT_TIME || {
    weekday: dayInfo.name,
    date: dayInfo.date,
    hour: now.getHours(),
    minute: now.getMinutes(),
  };
}

function parseActTime(act) {
  // Returns { weekday, hour, minute }
  const m = act.time.match(/^(\w+),\s+(\d{2})\.(\d{2})\.(\d{4})\s+\|\s+(\d{2}):(\d{2})/);
  if (!m) return null;
  return {
    weekday: m[1],
    day: parseInt(m[2]),
    month: parseInt(m[3]),
    year: parseInt(m[4]),
    hour: parseInt(m[5]),
    minute: parseInt(m[6]),
  };
}

function minuteOfDay(t) { return t.hour * 60 + t.minute; }

function findCurrentAndUpcoming(moment) {
  // Für jede pick-act, finde ob NOW (=aktuelle Zeit) oder UPCOMING
  const myActObjects = MY_PICKS.map(p => ALL_ACTS.find(a => a.name === p.name)).filter(Boolean);
  const now = minuteOfDay(moment);
  // Finde aktuell laufende
  const nowAct = myActObjects.find(a => {
    const t = parseActTime(a);
    if (!t || t.weekday !== moment.weekday) return false;
    const m = minuteOfDay(t);
    return m <= now && m + 90 > now;  // 90 min Set-Annahme
  });
  // Upcoming = nächste 4 nach now
  const upcoming = myActObjects
    .filter(a => {
      const t = parseActTime(a);
      if (!t) return false;
      if (t.weekday !== moment.weekday) return t.weekdayOrder() > moment.weekdayOrder();
      return minuteOfDay(t) > now;
    })
    .map(a => ({ act: a, time: parseActTime(a) }))
    .sort((a, b) => dayMinute(a.time) - dayMinute(b.time))
    .slice(0, 5);
  return { now: nowAct, upcoming };
}

function dayMinute(t) {
  const dayOrder = { 'Mittwoch': 0, 'Donnerstag': 1, 'Freitag': 2, 'Samstag': 3, 'Sonntag': 4 };
  return dayOrder[t.weekday] * 24 * 60 + minuteOfDay(t);
}
// Prototyp-Hack: weekdayOrder() als String-Vergleich
const _orig = String.prototype.weekdayOrder;
if (!_orig) {
  String.prototype.weekdayOrder = function() {
    const o = { 'Mittwoch': 0, 'Donnerstag': 1, 'Freitag': 2, 'Samstag': 3, 'Sonntag': 4 };
    return o[this] || 0;
  };
}

function render() {
  const moment = getCurrentMoment();
  const clock = `${String(moment.hour).padStart(2, '0')}:${String(moment.minute).padStart(2, '0')}`;
  document.getElementById('bigClock').textContent = clock;
  document.getElementById('bigDay').textContent = `${moment.weekday}, ${moment.date}`;
  document.getElementById('tcInfo').textContent = CURRENT_TIME
    ? `Vorschau: ${moment.weekday} ${clock} · ${moment.date}`
    : `Echtzeit-Modus (System-Uhr auf Festival-Tag gemappt)`;
  // Now / Upcoming
  const { now, upcoming } = findCurrentAndUpcoming(moment);
  const nowArea = document.getElementById('nowArea');
  if (MY_PICKS.length === 0) {
    nowArea.innerHTML = `
      <div class="not-yet">
        <h3>🎯 Keine Picks geladen</h3>
        <p style="font-size:13px;margin-bottom:10px">Öffne erst <a href="../001-festival-pass/" style="color:var(--accent)">Festival-Pass</a> oder <a href="../002-swipe-tinder/" style="color:var(--accent)">Swipe</a>, markiere deine Acts, dann zeig dir Live was als nächstes läuft.</p>
      </div>
    `;
    document.getElementById('upNext').style.display = 'none';
    return;
  }
  if (now) {
    const t = parseActTime(now);
    const distance = STAGE_DIST[now.stage] || 200;
    const walkingMin = Math.round(distance / 80);
    nowArea.innerHTML = `
      <div class="now-hero">
        <div class="now-tag">▶ JETZT LIVE</div>
        <div class="now-name">${now.name}</div>
        <div class="now-meta">
          <span class="stage-badge stage-${now.stage}">${now.stage}</span>
          · ${t.hour}:${String(t.minute).padStart(2, '0')} – ${(t.hour + 1)}:${String(t.minute).padStart(2,'0')}
          · Score ${now.score} pts · ${now.genre}
        </div>
        <div class="now-bridge">
          <strong>Weil du ${now.bridge[0]}</strong>${now.bridge[1] ? ` und <em>${now.bridge[1]}</em>` : ''} hörst — Spotify-Affinität ${now.score} pts
        </div>
        <div class="now-actions">
          <button onclick="markAttended('${now.name.replace(/'/g, "\\'")}')">✓ War da</button>
          <button onclick="markMissed('${now.name.replace(/'/g, "\\'")}')">✕ Verpasst</button>
          <button class="primary" onclick="navigateTo('${now.stage}')">📍 Hinweg (${distance}m, ${walkingMin} min)</button>
        </div>
      </div>
    `;
  } else {
    const next = upcoming[0];
    if (next) {
      const distance = STAGE_DIST[next.act.stage] || 200;
      const walkingMin = Math.round(distance / 80);
      const minUntil = (dayMinute(next.time) - (moment.weekday.weekdayOrder() * 24 * 60 + minuteOfDay(moment)));
      const hh = Math.floor(minUntil / 60);
      const mm = minUntil % 60;
      nowArea.innerHTML = `
        <div class="now-hero" style="background:linear-gradient(135deg, rgba(59,130,246,0.1) 0%, rgba(59,130,246,0.02) 100%);border-color:var(--upcoming);box-shadow:none;">
          <div class="now-tag" style="color:var(--upcoming)">⏭ ALS NÄCHSTES IN ${hh > 0 ? hh + 'h ' : ''}${mm}min</div>
          <div class="now-name">${next.act.name}</div>
          <div class="now-meta">
            <span class="stage-badge stage-${next.act.stage}">${next.act.stage}</span>
            · ${next.time.hour}:${String(next.time.minute).padStart(2, '0')} · ${next.act.genre}
          </div>
          <div class="now-bridge" style="border-color:var(--upcoming);background:rgba(59,130,246,0.1)">
            <strong style="color:var(--upcoming)">Weil du ${next.act.bridge[0]}</strong>${next.act.bridge[1] ? ` und <em>${next.act.bridge[1]}</em>` : ''} hörst
          </div>
          <div class="now-actions">
            <button onclick="setReminder('${next.act.name.replace(/'/g, "\\'")}', '${next.time.weekday}', ${next.time.hour}, ${next.time.minute})">⏰ Set-Erinnerung</button>
            <button class="primary" onclick="navigateTo('${next.act.stage}')">📍 Hinweg (${distance}m, ${walkingMin} min)</button>
          </div>
        </div>
      `;
    } else {
      nowArea.innerHTML = `
        <div class="not-yet">
          <h3>🌙 Pause</h3>
          <p style="font-size:13px">Keine deiner Picks um ${clock}. Geh raus, hör ein Unbekanntes, oder trink Bier mit deinen Leuten.</p>
        </div>
      `;
    }
  }
  // Up next list
  const upNextEl = document.getElementById('upNext');
  if (upcoming.length > 1) {
    upNextEl.style.display = 'block';
    const list = document.getElementById('nextList');
    list.innerHTML = upcoming.slice(1).map(({ act, time }) => {
      const distance = STAGE_DIST[act.stage] || 200;
      const walkingMin = Math.round(distance / 80);
      return `
        <div class="next-row">
          <div class="nx-time">${time.hour}:${String(time.minute).padStart(2,'0')}<small>${time.weekday.substring(0,2)}</small></div>
          <div>
            <div class="nx-name">${act.name}</div>
            <div class="nx-meta"><span class="stage-badge stage-${act.stage}">${act.stage}</span> · ${act.genre}</div>
          </div>
          <div class="nx-distance walking">${distance}m · ${walkingMin}min</div>
        </div>
      `;
    }).join('');
  } else {
    upNextEl.style.display = 'none';
  }
  // Reminder
  checkReminder(moment);
}

function setReminder(name, weekday, hour, minute) {
  REMINDER_ACT = { name, weekday, hour, minute };
  REMINDER_FIRED = false;
  document.getElementById('reminderTarget').textContent = `→ ${name} (${weekday} ${hour}:${String(minute).padStart(2,'0')})`;
  toast(`⏰ Erinnerung gesetzt: ${name} in ${REMINDER_LEAD} min`);
  saveReminder();
}

function saveReminder() {
  localStorage.setItem('herzberg_live_reminder_v1', JSON.stringify({ act: REMINDER_ACT, lead: REMINDER_LEAD, fired: REMINDER_FIRED }));
}
function loadReminder() {
  try {
    const r = JSON.parse(localStorage.getItem('herzberg_live_reminder_v1') || 'null');
    if (r && r.act) {
      REMINDER_ACT = r.act;
      REMINDER_LEAD = r.lead || 10;
      REMINDER_FIRED = r.fired || false;
      document.getElementById('reminderTarget').textContent = `→ ${r.act.name} (${r.act.weekday} ${r.act.hour}:${String(r.act.minute).padStart(2,'0')})`;
      document.getElementById('reminderLead').value = r.lead || 10;
    }
  } catch {}
}

function checkReminder(moment) {
  if (!REMINDER_ACT || REMINDER_FIRED) return;
  if (REMINDER_ACT.weekday !== moment.weekday) return;
  const actMin = REMINDER_ACT.hour * 60 + REMINDER_ACT.minute;
  const nowMin = minuteOfDay(moment);
  if (nowMin >= actMin - REMINDER_LEAD && nowMin < actMin) {
    REMINDER_FIRED = true;
    saveReminder();
    toast(`⏰ ${REMINDER_ACT.name} startet in ${actMin - nowMin} min!`);
    // Vibration
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
    // Notification
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification(`Herzberg: ${REMINDER_ACT.name}`, { body: `Startet in ${actMin - nowMin} min · ${REMINDER_ACT.weekday} ${REMINDER_ACT.hour}:${String(REMINDER_ACT.minute).padStart(2,'0')}` });
    }
  }
}

function markAttended(name) {
  const att = JSON.parse(localStorage.getItem('herzberg_diary_attended_v1') || '[]');
  if (!att.includes(name)) att.push(name);
  localStorage.setItem('herzberg_diary_attended_v1', JSON.stringify(att));
  toast('✓ Als "war da" markiert');
}
function markMissed(name) {
  const att = JSON.parse(localStorage.getItem('herzberg_diary_missed_v1') || '[]');
  if (!att.includes(name)) att.push(name);
  localStorage.setItem('herzberg_diary_missed_v1', JSON.stringify(att));
  toast('✕ Als "verpasst" markiert');
}
function navigateTo(stage) {

}

document.getElementById('reminderLead').addEventListener('change', e => {

});

document.querySelectorAll('#timeButtons button').forEach(btn => {

      CURRENT_TIME = null;

      CURRENT_TIME = { weekday: btn.dataset.day, date: '29.07.-02.08.2026', hour: h, minute: m };
    }
    render();
  });
});
