<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Herzberg Swipe · Marcus</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #0f0a14;
    --bg-2: #1a1020;
    --card: #1f1428;
    --card-2: #2a1a36;
    --ink: #f1e8f5;
    --ink-soft: #a89bb5;
    --accent: #ff3d6e;
    --accent-2: #ff8e3c;
    --yes: #00d97e;
    --no: #ff3d6e;
    --maybe: #ffb13d;
    --shadow: 0 20px 60px -10px rgba(0,0,0,0.7);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 18px 24px;
    min-height: 100vh;
  }
  /* --- Header --- */
  h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
    text-align: center;
  }
  .sub {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 20px;
    text-align: center;
  }
  /* --- Stack --- */
  .stack {
    position: relative;
    width: 100%;
    max-width: 340px;
    height: 460px;
    margin-bottom: 20px;
  }
  .card {
    position: absolute;
    inset: 0;
    background: var(--card);
    border-radius: 24px;
    padding: 26px 22px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255,255,255,0.08);
    display: flex;
    flex-direction: column;
    cursor: grab;
    user-select: none;
    transition: transform 0.18s, opacity 0.18s;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,61,110,0.06) 0%, rgba(255,142,60,0.04) 100%);
    pointer-events: none;
  }
  .card.dragging { transition: none; cursor: grabbing; }
  .card.going { transition: transform 0.4s cubic-bezier(0.5, -0.5, 0.5, 1.5), opacity 0.4s; }
  .card.going.yes { transform: translate(120%, 0) rotate(20deg) !important; opacity: 0; }
  .card.going.no { transform: translate(-120%, 0) rotate(-20deg) !important; opacity: 0; }
  .card-stack-2 { transform: scale(0.95) translateY(8px); opacity: 0.7; }
  .card-stack-3 { transform: scale(0.9) translateY(16px); opacity: 0.4; }
  .card-stack-4 { display: none; }
  .card-stamp {
    position: absolute;
    top: 60px;
    padding: 6px 14px;
    border: 4px solid currentColor;
    border-radius: 6px;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0;
    transform: rotate(-15deg);
    pointer-events: none;
  }
  .card-stamp.yes { left: 16px; color: var(--yes); transform: rotate(-15deg); }
  .card-stamp.no { right: 16px; color: var(--no); transform: rotate(15deg); }
  .card.showing-yes .card-stamp.yes { opacity: 1; }
  .card.showing-no .card-stamp.no { opacity: 1; }
  .card-tag {
    align-self: flex-start;
    background: var(--accent);
    color: white;
    padding: 4px 10px;
    border-radius: 14px;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .card[data-tier="TOP"] .card-tag { background: var(--accent); }
  .card[data-tier="HIT"] .card-tag { background: var(--accent-2); }
  .card[data-tier="NICE"] .card-tag { background: var(--maybe); color: var(--bg); }
  .card[data-tier="NEW"] .card-tag { background: var(--ink-soft); color: var(--bg); }
  .card-name {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .card-time {
    font-size: 14px;
    color: var(--accent-2);
    font-weight: 600;
    margin-bottom: 4px;
    font-family: 'Courier New', monospace;
  }
  .card-stage {
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .card-genre {
    color: var(--ink-soft);
    font-style: italic;
    font-size: 13px;
    margin-bottom: 20px;
    line-height: 1.4;
  }
  .card-bridge {
    background: rgba(255,61,110,0.12);
    border-left: 3px solid var(--accent);
    padding: 10px 12px;
    border-radius: 0 6px 6px 0;
    font-size: 13px;
    line-height: 1.4;
    margin-bottom: 14px;
  }
  .card-bridge strong { color: var(--accent); font-weight: 700; }
  .card-bridge em { color: var(--accent-2); font-style: normal; }
  .card-meta {
    margin-top: auto;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 1px;
    text-transform: uppercase;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .card-meta .score { color: var(--accent); font-weight: 700; }
  /* --- Buttons --- */
  .actions {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin-bottom: 12px;
  }
  .action-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid;
    background: var(--card);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    transition: transform 0.1s, background 0.1s;
  }
  .action-btn:hover { transform: scale(1.1); }
  .action-btn:active { transform: scale(0.95); }
  .action-btn.no { color: var(--no); border-color: var(--no); }
  .action-btn.no:hover { background: var(--no); color: white; }
  .action-btn.maybe { color: var(--maybe); border-color: var(--maybe); width: 48px; height: 48px; font-size: 18px; }
  .action-btn.maybe:hover { background: var(--maybe); color: var(--bg); }
  .action-btn.yes { color: var(--yes); border-color: var(--yes); }
  .action-btn.yes:hover { background: var(--yes); color: var(--bg); }
  /* --- Counter --- */
  .counter {
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .counter strong { color: var(--accent); font-size: 14px; }
  /* --- Button Strip --- */
  .strip {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 4px;
  }
  .strip button {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--ink);
    padding: 7px 12px;
    border-radius: 16px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
  }
  .strip button:hover { background: var(--card-2); }
  .strip button.active { background: var(--accent); border-color: var(--accent); }
  /* --- Empty state --- */
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-soft);
  }
  .empty h2 {
    color: var(--accent);
    font-size: 22px;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  /* --- Result screen --- */
  .result {
    width: 100%;
    max-width: 340px;
    background: var(--card);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .result h3 {
    color: var(--accent);
    font-size: 14px;
    margin-bottom: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .result-list {
    list-style: none;
  }
  .result-list li {
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .result-list li:last-child { border-bottom: none; }
  .result-list .day {
    font-size: 11px;
    color: var(--ink-soft);
    font-family: 'Courier New', monospace;
  }
  /* --- Footer --- */
  .footer {
    text-align: center;
    color: var(--ink-soft);
    font-size: 10px;
    letter-spacing: 1px;
    padding: 16px 0 0;
    max-width: 340px;
  }
  .again-btn {
    background: var(--accent);
    border: none;
    color: white;
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin: 12px auto;
    display: block;
    font-family: inherit;
    letter-spacing: 1px;
  }
  .again-btn:hover { background: var(--accent-2); }
  /* --- Decision indicators --- */
  .decision {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 16px;
    min-height: 18px;
  }
  .decision strong { color: var(--accent); }
</style>
</head>
<body>

<h1>HERZBERG SWIPE</h1>
<div class="sub">2026 · finde dein festival</div>

<div class="decision" id="decision">← Nein · Vielleicht · Jawoll →</div>

<div class="stack" id="stack"></div>

<div class="actions">
  <button class="action-btn no" onclick="decide('no')">✕</button>
  <button class="action-btn maybe" onclick="decide('maybe')">?</button>
  <button class="action-btn yes" onclick="decide('yes')">♥</button>
</div>

<div class="counter">
  <span><strong id="yesCount">0</strong> jawoll</span> ·
  <span><strong id="maybeCount">0</strong> vielleicht</span> ·
  <span><strong id="noCount">0</strong> nein</span> ·
  <span><strong id="remaining">0</strong> offen</span>
</div>

<div class="strip">
  <button onclick="resetPicks()">↻ Reset</button>
  <button onclick="exportPicks()">📤 Export</button>
  <button onclick="showResult()">📋 Mein Plan</button>
</div>

<div id="resultArea"></div>

<div class="footer">
  Built with Spotify + sweat · Daten: herzberg-festival.com + PKS<br>
  Lokal, keine Cloud, deine Swipes bleiben in deinem Browser
</div>

<script>
const DATA_URL = 'inline';
let ALL_ACTS = [];
let PICKS = { yes: [], no: [], maybe: [] };
let SHUFFLE = [];
let POINTER = 0;
const STORAGE_KEY = 'herzberg_swipe_v1';

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    PICKS = s.picks || { yes: [], no: [], maybe: [] };
    POINTER = s.pointer || 0;
  } catch { PICKS = { yes: [], no: [], maybe: [] }; }
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ picks: PICKS, pointer: POINTER }));
}

function shuffleAndPrepare() {
  // Höchste Tier zuerst (TOP → HIT → NICE → NEW), innerhalb gleicher Tier random
  const tier = { TOP: 0, HIT: 1, NICE: 2, NEW: 3 };
  SHUFFLE = [...ALL_ACTS].sort((a, b) => {
    const t = tier[a.tier] - tier[b.tier];
    if (t !== 0) return t;
    return Math.random() - 0.5;
  });
  POINTER = 0;
}

function render() {
  updateCounter();
  const stack = document.getElementById('stack');
  if (POINTER >= SHUFFLE.length) {
    stack.innerHTML = `<div class="card"><div class="empty"><h2>Du hast alle ${SHUFFLE.length} Acts geswipt! 🎉</h2><p>Tippe "Reset" für einen neuen Durchlauf oder "Mein Plan" für die Auswertung.</p></div></div>`;
    return;
  }
  const visible = SHUFFLE.slice(POINTER, POINTER + 3);
  const html = visible.map((a, i) => {
    const stackClass = ['card-stack-1', 'card-stack-2', 'card-stack-3'][i] || 'card-stack-4';
    const isTop = i === 0;
    const bridgeTxt = a.bridge[0]
      ? `Weil du <strong>${a.bridge[0]}</strong>${a.bridge[1] ? ` und <em>${a.bridge[1]}</em>` : ''} hörst — passt das?`
      : 'Unknown territory — Überraschung gefällig?';
    const day = (a.time || '').match(/^(Mittwoch|Donnerstag|Freitag|Samstag|Sonntag)/)?.[1] || '';
    const time = (a.time || '').split(' | ')[1] || '';
    return `
      <div class="card ${stackClass}" data-tier="${a.tier}" data-idx="${POINTER + i}">
        <div class="card-stamp yes">JA</div>
        <div class="card-stamp no">NEIN</div>
        <div class="card-tag">${a.tier === 'TOP' ? '⭐ TOP' : a.tier === 'HIT' ? '⚡ HIT' : a.tier === 'NICE' ? '💫 NICE' : '🌱 NEW'}</div>
        <div class="card-name">${a.name}</div>
        <div class="card-time">${day} · ${time}</div>
        <div class="card-stage">${a.stage}</div>
        <div class="card-genre">${a.genre}</div>
        <div class="card-bridge">${bridgeTxt}</div>
        <div class="card-meta">Spotify-Affinität <span class="score">${a.score} pts</span></div>
      </div>
    `;
  }).join('');
  stack.innerHTML = html;
  // Bind drag
  const top = stack.querySelector('.card-stack-1');
  if (top) bindDrag(top);
}

function bindDrag(card) {
  let startX = null, currentX = 0, dragging = false;
  const onStart = (e) => {
    dragging = true;
    card.classList.add('dragging');
    startX = (e.touches ? e.touches[0].clientX : e.clientX) - currentX;
  };
  const onMove = (e) => {
    if (!dragging) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    currentX = x - startX;
    const rot = currentX * 0.05;
    card.style.transform = `translateX(${currentX}px) rotate(${rot}deg)`;
    card.classList.toggle('showing-yes', currentX > 60);
    card.classList.toggle('showing-no', currentX < -60);
  };
  const onEnd = () => {
    if (!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    if (currentX > 90) {
      card.classList.add('going', 'yes');
      setTimeout(() => decide('yes'), 280);
    } else if (currentX < -90) {
      card.classList.add('going', 'no');
      setTimeout(() => decide('no'), 280);
    } else {
      card.style.transform = '';
      card.classList.remove('showing-yes', 'showing-no');
    }
    currentX = 0;
  };
  card.addEventListener('mousedown', onStart);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onEnd);
  card.addEventListener('touchstart', onStart, { passive: true });
  document.addEventListener('touchmove', onMove, { passive: true });
  document.addEventListener('touchend', onEnd);
}

function decide(verdict) {
  if (POINTER >= SHUFFLE.length) return;
  const act = SHUFFLE[POINTER];
  PICKS[verdict].push({ name: act.name, time: act.time, stage: act.stage, tier: act.tier, score: act.score });
  POINTER++;
  save();
  render();
}

function updateCounter() {
  document.getElementById('yesCount').textContent = PICKS.yes.length;
  document.getElementById('noCount').textContent = PICKS.no.length;
  document.getElementById('maybeCount').textContent = PICKS.maybe.length;
  document.getElementById('remaining').textContent = Math.max(0, SHUFFLE.length - POINTER);
}

function resetPicks() {
  if (!confirm('Wirklich alle Swipes löschen?')) return;
  PICKS = { yes: [], no: [], maybe: [] };
  POINTER = 0;
  shuffleAndPrepare();
  save();
  document.getElementById('resultArea').innerHTML = '';
  render();
}

function exportPicks() {
  const data = {
    user: 'Marcus',
    timestamp: new Date().toISOString(),
    festival: 'Herzberg 2026',
    summary: {
      yes: PICKS.yes.length,
      no: PICKS.no.length,
      maybe: PICKS.maybe.length,
    },
    picks: PICKS,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `herzberg-swipe-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function showResult() {
  const area = document.getElementById('resultArea');
  const all = PICKS.yes.concat(PICKS.maybe).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  const byDay = {};
  for (const p of all) {
    const day = (p.time || '').match(/^(Mittwoch|Donnerstag|Freitag|Samstag|Sonntag)/)?.[1] || '?';
    if (!byDay[day]) byDay[day] = [];
    byDay[day].push(p);
  }
  const dayOrder = ['Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
  let html = `<div class="result"><h3>📋 Dein Herzberg-Plan</h3><p style="font-size:12px;color:var(--ink-soft);margin-bottom:10px">${PICKS.yes.length} Jawoll + ${PICKS.maybe.length} Vielleicht</p>`;
  for (const day of dayOrder) {
    if (!byDay[day] || byDay[day].length === 0) continue;
    html += `<div style="margin-top:12px"><strong style="color:var(--accent-2);font-size:12px;letter-spacing:2px;">${day}</strong></div><ul class="result-list">`;
    for (const p of byDay[day]) {
      const time = (p.time || '').split(' | ')[1] || '';
      html += `<li><span>${p.name}</span><span class="day">${time} · ${p.stage}</span></li>`;
    }
    html += `</ul>`;
  }
  html += `</div>`;
  // Konflikt-Warnung
  const conflicts = findConflicts(all);
  if (conflicts.length > 0) {
    html += `<div class="result"><h3>⚠️ Konflikte</h3><p style="font-size:12px;color:var(--ink-soft);margin-bottom:8px">Diese Acts überlappen:</p>`;
    for (const c of conflicts) {
      html += `<div style="font-size:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05)"><strong>${c.time}</strong><br>${c.acts.map(a => `→ ${a.name}`).join('<br>')}</div>`;
    }
    html += `</div>`;
  }
  html += `<button class="again-btn" onclick="document.getElementById('resultArea').innerHTML=''">Schließen</button>`;
  area.innerHTML = html;
}

function findConflicts(picks) {
  const bySlot = {};
  for (const p of picks) {
    if (!bySlot[p.time]) bySlot[p.time] = [];
    bySlot[p.time].push(p);
  }
  const conflicts = [];
  for (const t in bySlot) {
    if (bySlot[t].length > 1) conflicts.push({ time: t, acts: bySlot[t] });
  }
  return conflicts.sort((a, b) => a.time.localeCompare(b.time));
}

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') decide('no');
  if (e.key === 'ArrowRight') decide('yes');
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); decide('maybe'); }
});

// Boot
load();
