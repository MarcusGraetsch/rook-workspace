<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Herzberg Diary · Marcus</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #1a1410;
    --paper: #f4ead8;
    --paper-2: #ede1c5;
    --ink: #2a1f15;
    --ink-soft: #5d4a35;
    --line: #c9b994;
    --accent: #c9410f;
    --accent-soft: #e8884a;
    --stamp: #b8390e;
    --green: #2d6a4f;
    --gray: #6c757d;
    --red: #9d2222;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--paper);
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
  }
  body { padding: 24px 18px 60px; max-width: 800px; margin: 0 auto; }
  /* --- Book cover --- */
  .cover {
    text-align: center;
    padding: 40px 20px;
    background: var(--paper);
    color: var(--ink);
    border-radius: 8px;
    margin-bottom: 24px;
    box-shadow: 0 12px 30px -8px rgba(0,0,0,0.5);
    border: 1px solid var(--line);
    position: relative;
  }
  .cover::before, .cover::after {
    content: '∞';
    position: absolute;
    font-size: 60px;
    color: var(--accent);
    opacity: 0.15;
    font-family: 'Courier New', monospace;
  }
  .cover::before { top: 12px; left: 18px; }
  .cover::after { bottom: 12px; right: 18px; }
  .cover h1 {
    font-size: 36px;
    font-weight: normal;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .cover h2 {
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 8px;
    text-transform: uppercase;
    font-weight: normal;
    margin-bottom: 24px;
  }
  .cover .date {
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 20px;
    font-style: italic;
  }
  .cover .stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding-top: 16px;
    border-top: 1px dashed var(--line);
    margin-top: 16px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .cover .stats strong { color: var(--accent); font-size: 18px; }
  /* --- Mode switcher --- */
  .mode-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    background: rgba(0,0,0,0.3);
    padding: 4px;
    border-radius: 8px;
  }
  .mode-bar button {
    flex: 1;
    padding: 10px;
    background: transparent;
    border: none;
    color: var(--ink-soft);
    font-family: 'Georgia', serif;
    font-size: 13px;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.1s;
  }
  .mode-bar button.active { background: var(--accent); color: var(--paper); }
  .mode-bar button:hover:not(.active) { color: var(--paper); }
  /* --- Diary entry --- */
  .entry {
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 18px 22px;
    margin-bottom: 18px;
    box-shadow: 0 6px 20px -8px rgba(0,0,0,0.4);
    border: 1px solid var(--line);
    position: relative;
  }
  .entry::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: var(--accent);
    border-radius: 4px 0 0 4px;
  }
  .entry.attended::before { background: var(--green); }
  .entry.missed::before { background: var(--red); opacity: 0.5; }
  .entry-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--line);
  }
  .entry-time {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 1px;
  }
  .entry-stage {
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .entry-name {
    font-size: 22px;
    font-weight: bold;
    line-height: 1.1;
    margin-bottom: 4px;
  }
  .entry-genre {
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
    margin-bottom: 12px;
  }
  .entry-bridge {
    font-size: 12px;
    color: var(--stamp);
    font-family: 'Courier New', monospace;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    padding: 6px 8px;
    background: rgba(201,65,15,0.08);
    border-left: 2px solid var(--stamp);
  }
  /* Note textarea */
  .entry-note {
    width: 100%;
    background: var(--paper-2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 10px;
    font-family: 'Georgia', serif;
    font-size: 14px;
    line-height: 1.5;
    resize: vertical;
    min-height: 60px;
  }
  .entry-note:focus { outline: none; border-color: var(--accent); }
  /* Photo */
  .entry-photo {
    margin-top: 10px;
    position: relative;
    border-radius: 3px;
    overflow: hidden;
    max-width: 100%;
  }
  .entry-photo img { width: 100%; display: block; border-radius: 3px; }
  .entry-photo .remove-photo {
    position: absolute;
    top: 6px;
    right: 6px;
    background: rgba(0,0,0,0.7);
    color: white;
    border: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
  }
  .entry-photo-input {
    margin-top: 8px;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .entry-photo-input input {
    font-size: 11px;
  }
  /* Rating */
  .entry-rating {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  .entry-rating .stars { display: flex; gap: 2px; }
  .entry-rating .star {
    cursor: pointer;
    font-size: 18px;
    color: var(--line);
    transition: color 0.1s;
  }
  .entry-rating .star.lit { color: var(--accent); }
  .entry-rating .star:hover { color: var(--accent-soft); }
  .entry-rating .r-label { color: var(--ink-soft); font-style: italic; font-size: 11px; }
  /* Actions */
  .entry-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .entry-actions button {
    background: var(--paper-2);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 5px 10px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .entry-actions button:hover { background: var(--line); color: var(--ink); }
  .entry-actions button.active.attended { background: var(--green); color: white; border-color: var(--green); }
  .entry-actions button.active.missed { background: var(--red); color: white; border-color: var(--red); }
  /* --- Stats overview (recap mode) --- */
  .recap-section {
    background: var(--paper);
    color: var(--ink);
    padding: 24px;
    border-radius: 4px;
    margin-bottom: 18px;
    box-shadow: 0 6px 20px -8px rgba(0,0,0,0.4);
    border: 1px solid var(--line);
  }
  .recap-section h2 {
    font-size: 18px;
    margin-bottom: 14px;
    color: var(--accent);
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--paper-2);
    padding: 12px;
    border-radius: 4px;
    border: 1px solid var(--line);
  }
  .stat-num {
    font-size: 28px;
    font-weight: bold;
    color: var(--accent);
    line-height: 1;
  }
  .stat-label {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 4px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .stat-bar {
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 6px;
  }
  .stat-bar > div {
    height: 100%;
    background: var(--accent);
  }
  .top-act {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 13px;
  }
  .top-act:last-child { border: none; }
  /* --- Footer --- */
  footer {
    text-align: center;
    color: var(--ink-soft);
    font-size: 11px;
    padding: 24px 0 0;
    border-top: 1px solid var(--line);
    margin-top: 24px;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
  }
  footer button {
    background: var(--accent);
    color: var(--paper);
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    margin: 4px;
  }
  footer button:hover { background: var(--accent-soft); }
  /* --- Empty state --- */
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-soft);
    font-style: italic;
  }
  .empty p { margin-top: 6px; font-size: 13px; }
  /* Print styles */
  @media print {
    body { background: white; padding: 0; }
    .mode-bar, footer, .entry-actions, .entry-photo-input { display: none; }
    .entry { box-shadow: none; page-break-inside: avoid; }
    .cover { box-shadow: none; }
  }
</style>
</head>
<body>

<div class="cover" id="cover">
  <h1>Herzberg 2026</h1>
  <h2>Festival-Tagebuch</h2>
  <div class="date">30. Juli – 2. August 2026</div>
  <div style="font-size:14px;letter-spacing:3px;color:var(--ink-soft)">∞ ETERNAL LOVE ∞</div>
  <div class="stats">
    <span><strong id="statEntries">0</strong><br>Notizen</span>
    <span><strong id="statAttended">0</strong><br>war da</span>
    <span><strong id="statMissed">0</strong><br>verpasst</span>
    <span><strong id="statPhotos">0</strong><br>Fotos</span>
  </div>
</div>

<div class="mode-bar">
  <button data-mode="diary" class="active">📖 Tagebuch</button>
  <button data-mode="recap">📊 Recap</button>
  <button data-mode="all">📜 Alle Acts</button>
</div>

<div id="content"></div>

<footer>
  <div>∞ Lokal gespeichert · keine Cloud · dein Festival, deine Worte ∞</div>
  <div style="margin-top:10px">
    <button onclick="exportDiary()">📤 Tagebuch exportieren (JSON)</button>
    <button onclick="window.print()">🖨 Drucken / Als PDF</button>
    <button onclick="document.getElementById('importDiary').click()">📥 Importieren</button>
  </div>
  <input type="file" id="importDiary" style="display:none" accept=".json" onchange="importDiary(event)">
</footer>

<script>
const DATA_URL = 'inline';
let ALL_ACTS = [];
let DIARY = {};  // name -> { note, photo (dataURL), rating (1-5), attended, missed }
let MY_PICKS = [];  // aus sketch 001/002/003
let CURRENT_MODE = 'diary';

const STORAGE = 'herzberg_diary_v1';

function load() {
  try {
    DIARY = JSON.parse(localStorage.getItem(STORAGE) || '{}');
  } catch { DIARY = {}; }
  // Pull picks from other sketches
  try {
    const swipe = JSON.parse(localStorage.getItem('herzberg_swipe_v1') || '{}');
    if (swipe.picks?.yes) MY_PICKS = swipe.picks.yes.map(p => p.name);
  } catch {}
  if (MY_PICKS.length === 0) {
    try { MY_PICKS = JSON.parse(localStorage.getItem('herzberg_stamps_v1') || '[]'); } catch {}
  }
  if (MY_PICKS.length === 0) {
    try { MY_PICKS = JSON.parse(localStorage.getItem('herzberg_picks_v1') || '[]'); } catch {}
  }
  // Pull attended/missed from live-mode
  try {
    const att = JSON.parse(localStorage.getItem('herzberg_diary_attended_v1') || '[]');
    const mis = JSON.parse(localStorage.getItem('herzberg_diary_missed_v1') || '[]');
    for (const n of att) { if (!DIARY[n]) DIARY[n] = {}; DIARY[n].attended = true; }
    for (const n of mis) { if (!DIARY[n]) DIARY[n] = {}; DIARY[n].missed = true; }
  } catch {}
}

function save() { localStorage.setItem(STORAGE, JSON.stringify(DIARY)); }

function setDiary(name, key, value) {
  if (!DIARY[name]) DIARY[name] = {};
  DIARY[name][key] = value;
  save();
  updateCoverStats();
}

function updateCoverStats() {
  const entries = Object.values(DIARY).filter(d => d.note || d.photo || d.rating).length;
  const attended = Object.values(DIARY).filter(d => d.attended).length;
  const missed = Object.values(DIARY).filter(d => d.missed).length;
  const photos = Object.values(DIARY).filter(d => d.photo).length;
  document.getElementById('statEntries').textContent = entries;
  document.getElementById('statAttended').textContent = attended;
  document.getElementById('statMissed').textContent = missed;
  document.getElementById('statPhotos').textContent = photos;
}

function renderDiary() {
  const content = document.getElementById('content');
  if (MY_PICKS.length === 0) {
    content.innerHTML = `
      <div class="empty">
        <h3>Keine Picks geladen</h3>
        <p>Markiere erst Acts in <a href="../001-festival-pass/">Festival-Pass</a> oder <a href="../002-swipe-tinder/">Swipe</a> — dann kannst du hier dein Tagebuch füllen.</p>
      </div>
    `;
    return;
  }
  // Sort by time
  const myActs = MY_PICKS.map(n => ALL_ACTS.find(a => a.name === n)).filter(Boolean)
    .sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  content.innerHTML = myActs.map(act => renderEntry(act)).join('');
}

function renderEntry(act) {
  const d = DIARY[act.name] || {};
  const stars = [1, 2, 3, 4, 5].map(i =>
    `<span class="star ${i <= (d.rating || 0) ? 'lit' : ''}" onclick="rateAct('${act.name.replace(/'/g, "\\'")}', ${i})">★</span>`
  ).join('');
  const photoHtml = d.photo
    ? `<div class="entry-photo"><img src="${d.photo}" alt=""><button class="remove-photo" onclick="removePhoto('${act.name.replace(/'/g, "\\'")}')">×</button></div>`
    : `<div class="entry-photo-input"><input type="file" accept="image/*" onchange="uploadPhoto(event, '${act.name.replace(/'/g, "\\'")}')"> 📷 Foto hinzufügen</div>`;
  const cls = ['entry', d.attended ? 'attended' : '', d.missed ? 'missed' : ''].filter(Boolean).join(' ');
  return `
    <div class="${cls}">
      <div class="entry-head">
        <div class="entry-time">${act.time || '–'}</div>
        <div class="entry-stage">${act.stage}</div>
      </div>
      <div class="entry-name">${act.name}</div>
      <div class="entry-genre">${act.genre} · ${act.score} pts · ${act.tier}</div>
      ${act.bridge[0] ? `<div class="entry-bridge">↪ ${act.bridge[0]}${act.bridge[1] ? ' · ' + act.bridge[1] : ''}</div>` : ''}
      <textarea class="entry-note" placeholder="Was ist passiert? Wie war's? Was hast du gefühlt?"
        onchange="setDiary('${act.name.replace(/'/g, "\\'")}', 'note', this.value)"
        oninput="setDiary('${act.name.replace(/'/g, "\\'")}', 'note', this.value)">${d.note || ''}</textarea>
      ${photoHtml}
      <div class="entry-rating">
        <span class="r-label">Rating:</span>
        <div class="stars">${stars}</div>
        <span class="r-label">${d.rating ? d.rating + '/5' : '–'}</span>
      </div>
      <div class="entry-actions">
        <button class="${d.attended ? 'active attended' : ''}" onclick="toggleAttended('${act.name.replace(/'/g, "\\'")}')">✓ War da</button>
        <button class="${d.missed ? 'active missed' : ''}" onclick="toggleMissed('${act.name.replace(/'/g, "\\'")}')">✕ Verpasst</button>
      </div>
    </div>
  `;
}

function rateAct(name, rating) {
  setDiary(name, 'rating', DIARY[name]?.rating === rating ? 0 : rating);
  renderDiary();
}
function toggleAttended(name) {
  const d = DIARY[name] || {};
  d.attended = !d.attended;
  if (d.attended) d.missed = false;
  DIARY[name] = d;
  save();
  renderDiary();
}
function toggleMissed(name) {
  const d = DIARY[name] || {};
  d.missed = !d.missed;
  if (d.missed) d.attended = false;
  DIARY[name] = d;
  save();
  renderDiary();
}
function removePhoto(name) {
  if (DIARY[name]) { delete DIARY[name].photo; save(); renderDiary(); }
}
function uploadPhoto(event, name) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 4 * 1024 * 1024) {
    alert('Bild zu groß (max 4MB)');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    setDiary(name, 'photo', e.target.result);
    renderDiary();
  };
  reader.readAsDataURL(file);
}

function renderRecap() {
  const content = document.getElementById('content');
  const entries = Object.entries(DIARY).filter(([n, d]) => d.note || d.photo || d.rating || d.attended);
  if (entries.length === 0) {
    content.innerHTML = `<div class="empty"><h3>Noch nichts zu berichten</h3><p>Notizen, Fotos, Ratings füllen — dann zeigt sich hier dein Recap.</p></div>`;
    return;
  }
  // Stats
  const all = MY_PICKS.map(n => ALL_ACS?.find ? ALL_ACS.find(a => a.name === n) : null).filter(Boolean);
  const totalPicks = MY_PICKS.length;
  const attended = Object.values(DIARY).filter(d => d.attended).length;
  const rated = Object.values(DIARY).filter(d => d.rating).length;
  const sumRating = Object.values(DIARY).filter(d => d.rating).reduce((s, d) => s + d.rating, 0);
  const avgRating = rated > 0 ? (sumRating / rated).toFixed(1) : '–';
  const notes = Object.values(DIARY).filter(d => d.note).length;
  const photos = Object.values(DIARY).filter(d => d.photo).length;
  const surprises = entries.filter(([n, d]) => {
    const a = ALL_ACTS.find(x => x.name === n);
    return a && a.tier === 'NEW' && d.attended && d.rating >= 3;
  }).length;
  const disappointments = entries.filter(([n, d]) => {
    const a = ALL_ACTS.find(x => x.name === n);
    return a && a.tier === 'TOP' && d.attended && d.rating && d.rating <= 2;
  }).length;
  // Top acts by rating
  const top = entries.filter(([n, d]) => d.rating).sort((a, b) => b[1].rating - a[1].rating).slice(0, 5);
  // By day
  const byDay = {};
  for (const [n, d] of entries) {
    const a = ALL_ACTS.find(x => x.name === n);
    if (!a) continue;
    const day = (a.time || '').match(/^(\w+)/)?.[1] || '?';
    if (!byDay[day]) byDay[day] = [];
    byDay[day].push({ act: a, d });
  }
  const dayOrder = ['Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
  let html = `
    <div class="recap-section">
      <h2>📊 Dein Festival in Zahlen</h2>
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-num">${attended}/${totalPicks}</div>
          <div class="stat-label">War da</div>
          <div class="stat-bar"><div style="width:${(attended/totalPicks*100).toFixed(0)}%"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${avgRating}</div>
          <div class="stat-label">Ø Rating</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${surprises}</div>
          <div class="stat-label">⭐ Überraschungen</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${disappointments}</div>
          <div class="stat-label">💔 Enttäuschungen</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${notes}</div>
          <div class="stat-label">Notizen</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${photos}</div>
          <div class="stat-label">Fotos</div>
        </div>
      </div>
    </div>
  `;
  if (top.length > 0) {
    html += `<div class="recap-section">
      <h2>🏆 Deine Top-Momente</h2>
      ${top.map(([n, d]) => {
        const a = ALL_ACTS.find(x => x.name === n);
        return `<div class="top-act">
          <span><strong>${'★'.repeat(d.rating)}</strong> · ${n}</span>
          <span style="color:var(--ink-soft);font-size:11px">${a ? a.time : ''}</span>
        </div>`;
      }).join('')}
    </div>`;
  }
  // Per day
  html += `<div class="recap-section"><h2>📅 Nach Tag</h2>`;
  for (const day of dayOrder) {
    const acts = byDay[day];
    if (!acts || acts.length === 0) continue;
    html += `<h3 style="color:var(--ink);font-size:14px;margin:14px 0 6px">${day} (${acts.length})</h3>`;
    for (const { act, d } of acts) {
      const stars = '★'.repeat(d.rating || 0) + '☆'.repeat(5 - (d.rating || 0));
      const status = d.attended ? '✓' : (d.missed ? '✕' : '·');
      html += `<div class="top-act">
        <span><strong>${status}</strong> ${act.name} <span style="color:var(--accent)">${stars}</span></span>
        <span style="color:var(--ink-soft);font-size:11px">${act.time?.split(' | ')[1] || ''}</span>
      </div>`;
      if (d.note) html += `<div style="padding:4px 16px 8px;font-size:13px;color:var(--ink-soft);font-style:italic">"${d.note}"</div>`;
    }
  }
  html += `</div>`;
  content.innerHTML = html;
}

function renderAll() {
  const content = document.getElementById('content');
  const all = ALL_ACTS.slice().sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  content.innerHTML = all.map(act => {
    const isMyPick = MY_PICKS.includes(act.name);
    const d = DIARY[act.name] || {};
    return `
      <div class="entry ${d.attended ? 'attended' : ''} ${d.missed ? 'missed' : ''}" style="opacity:${isMyPick ? '1' : '0.5'}">
        <div class="entry-head">
          <div class="entry-time">${act.time || '–'}</div>
          <div class="entry-stage">${act.stage} ${isMyPick ? '· ★' : ''}</div>
        </div>
        <div class="entry-name">${act.name}</div>
        <div class="entry-genre">${act.genre} · ${act.tier} · ${act.score} pts</div>
      </div>
    `;
  }).join('');
}

function exportDiary() {
  const data = {
    user: 'Marcus',
    festival: 'Herzberg 2026',
    timestamp: new Date().toISOString(),
    diary: DIARY,
    picks: MY_PICKS,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `herzberg-diary-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importDiary(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      // Merge: imported overwrites if exists, else adds
      for (const n in data.diary || {}) {
        DIARY[n] = { ...(DIARY[n] || {}), ...data.diary[n] };
      }
      save();
      if (CURRENT_MODE === 'diary') renderDiary();
      else if (CURRENT_MODE === 'recap') renderRecap();
      else renderAll();
      updateCoverStats();
      alert(`✓ Tagebuch von ${data.user || '?'} importiert`);
    } catch (err) {
      alert('Fehler: ' + err.message);
    }
  };
  reader.readAsText(file);
}

document.querySelectorAll('.mode-bar button').forEach(btn => {

    CURRENT_MODE = btn.dataset.mode;
    if (CURRENT_MODE === 'diary') renderDiary();
    else if (CURRENT_MODE === 'recap') renderRecap();
    else renderAll();
  });
});
